# Configuración de las herramientas de calidad del servidor.
# Todos los comandos se ejecutan desde la carpeta servidor/.
 
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
 
[tool.ruff]
target-version = "py310"
line-length = 88
 
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PTH"]
 
[tool.mypy]
strict = true
files = ["main.py", "tests"]
 
[package]
name = "aplicacion"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "Cuentas Claras: casos de uso y puertos"

[dependencies]
dominio = { path = "../dominio" }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
proptest = "1.12.0"
rust_decimal_macros = "1"
[package]
name = "app"
version = "0.1.0"
description = "Cuentas Claras: aplicación de escritorio"
authors = ["Grupo1_MakeNoMistake"]
license = "Apache-2.0"
repository = ""
edition = "2024"
rust-version = "1.90"
[workspace]
members = ["crates/*"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
dominio = { path = "crates/dominio" }
aplicacion = { path = "crates/aplicacion" }
infraestructura = { path = "crates/infraestructura" }
uuid = { version = "1.28.0", features = ["v4"] }
tauri-plugin-dialog = "2.8.3"
